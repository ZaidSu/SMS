<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="robots" content="noindex">
  <title>404 — Not Found | School Management System</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Inter",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f5f9;color:#0f172a}
    .wrap{text-align:center;padding:48px 28px;max-width:520px}
    .code{font-size:7rem;font-weight:800;color:#e2e8f0;line-height:1;letter-spacing:-4px;margin-bottom:4px}
    .icon{width:72px;height:72px;background:#eff6ff;border-radius:999px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:1.75rem;color:#2563eb}
    h1{font-size:1.625rem;font-weight:800;margin-bottom:10px;letter-spacing:-.02em}
    p{color:#475569;margin-bottom:32px;line-height:1.6;font-size:.9375rem}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;background:#2563eb;color:#fff;border-radius:10px;font-weight:700;font-size:.9rem;text-decoration:none;transition:background .15s,transform .1s}
    .btn:hover{background:#1d4ed8;transform:translateY(-1px)}
    .links{margin-top:24px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    .link{color:#2563eb;font-size:.8125rem;font-weight:600;text-decoration:none}
    .link:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="icon"><i class="fa-solid fa-compass-drafting"></i></div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved. Check the URL, or return to a portal below.</p>
    <a href="login/login.html" class="btn"><i class="fa-solid fa-arrow-right-to-bracket"></i>Sign In</a>
    <div class="links">
      <a href="admin/dashboard.html" class="link">Admin Portal</a>
      <a href="teacher/dashboard.html" class="link">Teacher Portal</a>
      <a href="parent/home.html" class="link">Parent Portal</a>
    </div>
  </div>
</body>
</html>
